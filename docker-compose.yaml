# TrueFan — Fan Control Dashboard for TrueNAS
# Fork: https://github.com/carlosvidalojea/truefan-for-it8622
#
# Prerequisites — run once on the TrueNAS host:
#   1. Copy app/mail_webhook.py to your NAS storage, e.g.:
#      cp app/mail_webhook.py /mnt/nas/apps/truefan/mail_webhook.py
#
#   2. Copy app/truefan_agent.py to your NAS storage, e.g.:
#      cp app/truefan_agent.py /mnt/nas/apps/truefan/truefan_agent.py
#
#   3. Add to System > Advanced > Init/Shutdown Scripts (Post Init):
#      - Command: modprobe it87 force_id=0x8622
#      - Command: nohup python3 /mnt/nas/apps/truefan/mail_webhook.py &
#      - Command: sudo sh -c 'python3 /mnt/nas/apps/truefan/truefan_agent.py >> /mnt/nas/apps/truefan/truefan_agent.log 2>&1 &'

services:
  truefan:
    container_name: truefan
    environment:
      - TZ=Europe/Madrid        # Set to your local timezone
    extra_hosts:
      - host-gateway:host-gateway     # Host IP detection via `extra_hosts`

    # Build the image locally from the Dockerfile
    build: .

    network_mode: bridge
    ports:
      - '5002:5002'             # Web dashboard — access at http://<NAS_IP>:5002
    restart: unless-stopped
    volumes:
      - /sys/class/hwmon:/sys/class/hwmon:ro
      - /etc/sensors3.conf:/etc/sensors3.conf:ro      # lm-sensors configuration — read-only

# TrueNAS web portal integration
x-portals:
  - host: 0.0.0.0
    name: Web UI
    path: /
    port: 5002
    scheme: http

